    <!-- Suppress Cloud Proxy HMR WebSocket Modal Overlays & Unhandled Rejection Loops -->
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('websocket') ||
          msg.includes('failed to connect') ||
          msg.includes('vite:ws') ||
          msg.includes('HMR')
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) {
            event.stopImmediatePropagation();
          }
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || event.filename || '')) || '';
        if (
          typeof msg === 'string' &&
          (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect'))
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) {
